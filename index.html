<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Премиум Контроль Возраста</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === Базовые стили и переменные === */
        :root {
            --bg-color: #f8fafc;
            --accent-color: #2563eb;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: #e2e8f0;
            --sidebar-shape-color: rgba(37, 99, 235, 0.05);
            --transition-speed: 0.5s;
        }

        /* Темы для вкладок */
        [data-theme="home"] {
            --bg-color: #f1f5f9;
            --accent-color: #2563eb;
            --sidebar-shape-color: rgba(37, 99, 235, 0.05);
        }

        [data-theme="stats"] {
            --bg-color: #f5f3ff;
            --accent-color: #7c3aed;
            --sidebar-shape-color: rgba(124, 58, 237, 0.05);
        }

        [data-theme="celebs"] {
            --bg-color: #f0fdf4;
            --accent-color: #059669;
            --sidebar-shape-color: rgba(5, 150, 105, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color var(--transition-speed) ease;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* === Анимации боковых панелей === */
        .sidebar-animation {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 200px;
            pointer-events: none;
            z-index: -1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .sidebar-left { left: 0; }
        .sidebar-right { right: 0; }

        .floating-shape {
            width: 60px;
            height: 60px;
            background-color: var(--sidebar-shape-color);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: morph 8s linear infinite alternate, float 12s ease-in-out infinite;
            transition: background-color var(--transition-speed) ease;
        }

        .floating-shape:nth-child(2) { animation-delay: -2s; width: 80px; height: 80px; }
        .floating-shape:nth-child(3) { animation-delay: -5s; width: 50px; height: 50px; }

        @keyframes morph {
            0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            100% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(180deg); }
        }

        /* === Шапка и навигация === */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
            background: rgba(0,0,0,0.03);
            padding: 0.4rem;
            border-radius: 12px;
        }

        .tab-btn {
            padding: 0.6rem 1.8rem;
            border: none;
            background: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #fff;
            color: var(--accent-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* === Основной контент === */
        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .tab-content {
            display: none;
            width: 100%;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === Карточки и Элементы Формы === */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            text-align: center;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 2rem;
            letter-spacing: -0.025em;
        }

        .input-group {
            display: grid;
            gap: 1.5rem;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-left: 0.5rem;
        }

        input {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease;
            background: white;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .primary-btn {
            padding: 1rem 2rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            height: 1.25rem;
            font-weight: 500;
        }

        /* === Список записей === */
        .entry-list {
            list-style: none;
            width: 100%;
            max-width: 500px;
            margin-top: 2rem;
        }

        .entry-item {
            background: white;
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .entry-item:hover { transform: scale(1.02); }
        .entry-item.selected { border-color: var(--accent-color); background: rgba(37,99,235,0.02); }

        .entry-info b { font-size: 1.1rem; display: block; }
        .entry-info span { font-size: 0.85rem; color: var(--text-secondary); }

        .remove-btn {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* === Статистика === */
        .stat-display { margin-top: 1rem; }
        .big-name { font-size: 3rem; font-weight: 900; color: var(--accent-color); margin-bottom: 0.5rem; }
        .detailed-age { font-size: 1.25rem; font-family: monospace; color: var(--text-secondary); font-weight: 600; }
        .countdown-timer { font-size: 2.5rem; font-weight: 800; margin-top: 1.5rem; font-variant-numeric: tabular-nums; }

        /* === Знаменитости === */
        .celeb-list {
            list-style: none;
            text-align: left;
            margin-top: 1rem;
        }

        .celeb-item {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .celeb-item:last-child { border-bottom: none; }
        .celeb-name { font-weight: 700; font-size: 1.1rem; }
        .celeb-desc { font-size: 0.9rem; color: var(--text-secondary); }

        .empty-state {
            padding: 4rem 2rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        @media (max-width: 640px) {
            .sidebar-animation { display: none; }
            .big-name { font-size: 2rem; }
            .countdown-timer { font-size: 1.75rem; }
        }
    </style>
</head>
<body data-theme="home">
    <div class="sidebar-animation sidebar-left">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>
    <div class="sidebar-animation sidebar-right">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <header>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-target="home">Главная</button>
            <button class="tab-btn" data-target="stats">Статистика</button>
            <button class="tab-btn" data-target="celebs">Знаменитости</button>
        </nav>
    </header>

    <main>
        <!-- Вкладка: Главная -->
        <section id="home" class="tab-content active">
            <div class="glass-card">
                <h2>Добавление данных</h2>
                <div class="input-group">
                    <div class="field">
                        <label>Имя</label>
                        <input type="text" id="name-input" placeholder="Введите имя">
                    </div>
                    <div class="field">
                        <label>Дата рождения</label>
                        <input type="text" id="date-input" placeholder="ДД.ММ.ГГГГ" maxlength="10">
                    </div>
                    <button id="add-btn" class="primary-btn">Добавить в список</button>
                </div>
                <p id="error-msg" class="error-msg"></p>
            </div>

            <ul id="entry-list" class="entry-list"></ul>
        </section>

        <!-- Вкладка: Статистика -->
        <section id="stats" class="tab-content">
            <div id="stats-view" class="glass-card" style="display: none;">
                <h2>Самый старший</h2>
                <div class="stat-display">
                    <div id="oldest-name" class="big-name">--</div>
                    <div id="oldest-age-detailed" class="detailed-age">--</div>
                </div>
                <div style="margin-top: 3rem;">
                    <label>До следующего дня рождения:</label>
                    <div id="countdown-timer" class="countdown-timer">--д --ч --м --с</div>
                </div>
            </div>
            <div id="stats-empty" class="empty-state">
                Список пуст. Добавьте участников на вкладке «Главная».
            </div>
        </section>

        <!-- Вкладка: Знаменитости -->
        <section id="celebs" class="tab-content">
            <div class="glass-card">
                <h2 id="celeb-header">Знаменитости</h2>
                <div id="celeb-status" class="empty-state">
                    Выберите человека из списка на главной вкладке, чтобы увидеть его «звёздных» двойников по дате рождения.
                </div>
                <ul id="celeb-list" class="celeb-list"></ul>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const state = {
                entries: [],
                oldest: null,
                selectedId: null
            };

            // Элементы
            const body = document.body;
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');
            const nameInput = document.getElementById('name-input');
            const dateInput = document.getElementById('date-input');
            const entryList = document.getElementById('entry-list');
            const errorMsg = document.getElementById('error-msg');

            const statsView = document.getElementById('stats-view');
            const statsEmpty = document.getElementById('stats-empty');
            const oldestName = document.getElementById('oldest-name');
            const oldestAgeDetailed = document.getElementById('oldest-age-detailed');
            const countdownTimer = document.getElementById('countdown-timer');

            const celebStatus = document.getElementById('celeb-status');
            const celebList = document.getElementById('celeb-list');
            const celebHeader = document.getElementById('celeb-header');

            // --- Навигация и Темы ---
            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const target = btn.dataset.target;
                    tabs.forEach(b => b.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));

                    btn.classList.add('active');
                    document.getElementById(target).classList.add('active');
                    body.dataset.theme = target;
                });
            });

            // --- Маска даты (ДД.ММ.ГГГГ) ---
            dateInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 8);
                let out = '';
                if (v.length > 0) out += v.substring(0, 2);
                if (v.length > 2) out += '.' + v.substring(2, 4);
                if (v.length > 4) out += '.' + v.substring(4, 8);
                e.target.value = out;
            });

            // --- Логика добавления ---
            document.getElementById('add-btn').addEventListener('click', () => {
                const name = nameInput.value.trim();
                const dStr = dateInput.value;

                if (!name || dStr.length < 10) {
                    showError('Пожалуйста, введите корректное имя и дату.');
                    return;
                }

                const parts = dStr.split('.');
                const birth = new Date(parts[2], parts[1] - 1, parts[0]);

                if (isNaN(birth.getTime()) || birth > new Date()) {
                    showError('Некорректная дата рождения.');
                    return;
                }

                const entry = {
                    id: Date.now(),
                    name,
                    birthDate: birth,
                    dStr
                };

                state.entries.push(entry);
                if (!state.selectedId) selectPerson(entry.id);

                updateUI();
                nameInput.value = '';
                dateInput.value = '';
                hideError();
            });

            function updateUI() {
                // Список на главной
                entryList.innerHTML = '';
                state.entries.forEach(item => {
                    const li = document.createElement('li');
                    li.className = `entry-item ${item.id === state.selectedId ? 'selected' : ''}`;
                    li.onclick = () => selectPerson(item.id);

                    li.innerHTML = `
                        <div class="entry-info">
                            <b>${item.name}</b>
                            <span>${item.dStr}</span>
                        </div>
                        <button class="remove-btn">Удалить</button>
                    `;

                    li.querySelector('.remove-btn').onclick = (e) => {
                        e.stopPropagation();
                        removePerson(item.id);
                    };
                    entryList.appendChild(li);
                });

                // Определение самого старшего
                if (state.entries.length > 0) {
                    state.oldest = state.entries.reduce((a, b) => a.birthDate < b.birthDate ? a : b);
                    statsView.style.display = 'block';
                    statsEmpty.style.display = 'none';
                    oldestName.textContent = state.oldest.name;
                } else {
                    state.oldest = null;
                    statsView.style.display = 'none';
                    statsEmpty.style.display = 'block';
                }
            }

            function removePerson(id) {
                state.entries = state.entries.filter(e => e.id !== id);
                if (state.selectedId === id) {
                    state.selectedId = state.entries.length > 0 ? state.entries[0].id : null;
                    if (state.selectedId) {
                        const p = state.entries.find(e => e.id === state.selectedId);
                        fetchCelebs(p.birthDate, p.name);
                    } else {
                        clearCelebs();
                    }
                }
                updateUI();
            }

            function selectPerson(id) {
                state.selectedId = id;
                const p = state.entries.find(e => e.id === id);
                fetchCelebs(p.birthDate, p.name);
                updateUI();
            }

            // --- Статистика в реальном времени ---
            setInterval(() => {
                if (!state.oldest) return;

                const now = new Date();
                const b = state.oldest.birthDate;

                // Детальный возраст
                let y = now.getFullYear() - b.getFullYear();
                let m = now.getMonth() - b.getMonth();
                let d = now.getDate() - b.getDate();
                let h = now.getHours() - b.getHours();
                let min = now.getMinutes() - b.getMinutes();
                let s = now.getSeconds() - b.getSeconds();

                if (s < 0) { s += 60; min--; }
                if (min < 0) { min += 60; h--; }
                if (h < 0) { h += 24; d--; }
                if (d < 0) { d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); m--; }
                if (m < 0) { m += 12; y--; }

                oldestAgeDetailed.textContent = `${y}л ${m}мес ${d}д ${h}ч ${min}мин ${s}с`;

                // Таймер до дня рождения
                let next = new Date(now.getFullYear(), b.getMonth(), b.getDate(), b.getHours(), b.getMinutes(), b.getSeconds());
                if (next < now) next.setFullYear(now.getFullYear() + 1);

                const diff = next - now;
                const dd = Math.floor(diff / 86400000);
                const hh = Math.floor((diff / 3600000) % 24);
                const mm = Math.floor((diff / 60000) % 60);
                const ss = Math.floor((diff / 1000) % 60);

                countdownTimer.textContent = `${dd}д ${hh}ч ${mm}мин ${ss}с`;
            }, 1000);

            // --- API Знаменитостей (Russian Wikipedia Action API) ---
            async function fetchCelebs(date, name) {
                celebStatus.textContent = 'Поиск знаменитостей...';
                celebStatus.style.display = 'block';
                celebList.innerHTML = '';
                celebHeader.textContent = `Знаменитости (как и ${name})`;

                const day = date.getDate();
                const monthNames = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
                const title = `${day}_${monthNames[date.getMonth()]}`;

                try {
                    const response = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&prop=extracts&titles=${encodeURIComponent(title)}&format=json&origin=*`);
                    const data = await response.json();

                    const pages = data.query.pages;
                    const pageId = Object.keys(pages)[0];
                    const extract = pages[pageId].extract;

                    if (extract) {
                        const temp = document.createElement('div');
                        temp.innerHTML = extract;

                        // Поиск раздела "Родились" (Born)
                        // В Action API разделы обычно идут как заголовки h2/h3
                        const headers = Array.from(temp.querySelectorAll('h2, h3, h4'));
                        const bornHeader = headers.find(h => h.textContent.includes('Родились'));

                        if (bornHeader) {
                            let list = bornHeader.nextElementSibling;
                            while (list && list.tagName !== 'UL') {
                                list = list.nextElementSibling;
                            }

                            if (list && list.tagName === 'UL') {
                                const items = Array.from(list.querySelectorAll('li')).slice(0, 10);
                                celebList.innerHTML = '';
                                items.forEach(item => {
                                    const text = item.textContent.replace(/\[\d+\]/g, '');
                                    const splitIdx = text.indexOf(' — ') !== -1 ? text.indexOf(' — ') : text.indexOf(' - ');

                                    const li = document.createElement('li');
                                    li.className = 'celeb-item';
                                    if (splitIdx !== -1) {
                                        li.innerHTML = `<span class="celeb-name">${text.substring(0, splitIdx)}</span>
                                                        <span class="celeb-desc">${text.substring(splitIdx + 3)}</span>`;
                                    } else {
                                        li.innerHTML = `<span class="celeb-name">${text}</span>`;
                                    }
                                    celebList.appendChild(li);
                                });
                                celebStatus.style.display = 'none';
                                return;
                            }
                        }
                    }
                    celebStatus.textContent = 'Информации о родившихся в этот день не найдено.';
                } catch (e) {
                    celebStatus.textContent = 'Ошибка загрузки данных из Wikipedia.';
                }
            }

            function clearCelebs() {
                celebList.innerHTML = '';
                celebStatus.style.display = 'block';
                celebStatus.textContent = 'Выберите человека из списка на главной вкладке.';
                celebHeader.textContent = 'Знаменитости';
            }

            function showError(msg) { errorMsg.textContent = msg; }
            function hideError() { errorMsg.textContent = ''; }
        });
    </script>
</body>
</html>
